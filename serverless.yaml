service: lambda-deploy-test

plugins:
  - serverless-iam-roles-per-function
  - serverless-step-functions

provider:
  name: aws
  region: ap-northeast-2
  stage: ${opt:stage, 'dev'}
  environment:
    STAGE: ${self:provider.stage}

  runtime: python3.10
  vpc:
    securityGroupIds:
      - sg-04622c208588a262c
    subnetIds:
      - subnet-0f9f617d0e5f127fd
      - subnet-07c1f65ad8a5d4fc2
  timeout: 600

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - 's3:GetObject'
            - 's3:PutObject'
            - 's3:ListBucket'
            - 's3:DeleteObject'

          Resource:
            - 'arn:aws:s3:::adds-json/*'
            - 'arn:aws:s3:::adds-json'

resources:
  Resources:
    slsTestBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: slstestbucket
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true


    S3VPCEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        ServiceName: com.amazonaws.ap-northeast-2.s3
        VpcId: vpc-0535b54bd4855f4d5
        RouteTableIds:
          - rtb-0883fe4f932151bfc
        VpcEndpointType: Gateway
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: 
                - 's3:GetObject'
                - 's3:PutObject'
                - 's3:ListBucket'
                - 's3:DeleteObject'
              Resource:
                - 'arn:aws:s3:::adds-json/*'
                - 'arn:aws:s3:::adds-json'

functions:
  filteringLambda:
    handler: filtering.lambda_handler
    layers:
      - arn:aws:lambda:ap-northeast-2:339713009546:layer:pymysql_layer:3

  dbToJsonLambda:
    handler: db_json_exporter.lambda_handler
    layers:
      - arn:aws:lambda:ap-northeast-2:339713009546:layer:pymysql_layer:3

  countLambda:
    handler: count.lambda_handler
    layers:
      - arn:aws:lambda:ap-northeast-2:339713009546:layer:pymysql_layer:3

  batchLambda:
    handler: batch.lambda_handler
    layers:
      - arn:aws:lambda:ap-northeast-2:339713009546:layer:pymysql_layer:3

  mergeLambda:
    handler: merge.lambda_handler
    layers:
      - arn:aws:lambda:ap-northeast-2:339713009546:layer:pymysql_layer:3
  
  droptableLambda:
    handler: drop_temp_table.lambda_handler
    layers:
      - arn:aws:lambda:ap-northeast-2:339713009546:layer:pymysql_layer:3



stepFunctions:
  stateMachines:
    batchProcessStateMachine:
      events:
        - http:
            path: /
            method: POST
      definition:
        StartAt: Filtering
        States:
          Filtering:
            Type: Task
            Resource: arn:aws:lambda:ap-northeast-2:339713009546:function:lambda-deploy-test-dev-filteringLambda
            Next: ParallelProcessing

          ParallelProcessing:
            Type: Parallel
            Next: Droptable
            Branches:
              - StartAt: DbToJson
                States:
                  DbToJson:
                    Type: Task
                    Resource: arn:aws:lambda:ap-northeast-2:339713009546:function:lambda-deploy-test-dev-dbToJsonLambda
                    End: true

              - StartAt: GetBatchNumbers
                States:
                  GetBatchNumbers:
                    Type: Task
                    Resource: arn:aws:lambda:ap-northeast-2:339713009546:function:lambda-deploy-test-dev-countLambda
                    Next: DynamicLambdaExecutions

                  DynamicLambdaExecutions:
                    Type: Map
                    MaxConcurrency: 20
                    ItemsPath: "$.batch_number"
                    Iterator:
                      StartAt: InvokeLambda
                      States:
                        InvokeLambda:
                          Type: Task
                          Resource: arn:aws:lambda:ap-northeast-2:339713009546:function:lambda-deploy-test-dev-batchLambda
                          Parameters:
                            "batch_number.$": "$"
                          End: true
                    Next: MergeBatchFiles

                  MergeBatchFiles:
                    Type: Task
                    Resource: arn:aws:lambda:ap-northeast-2:339713009546:function:lambda-deploy-test-dev-mergeLambda
                    End: true
          
          Droptable:
            Type: Task
            Resource: arn:aws:lambda:ap-northeast-2:339713009546:function:lambda-deploy-test-dev-droptableLambda
            End: true


#resource를 이용해서 추가하면 설정한 역할만 lambda 에 적용 
#iamRoleStatements 를 이용해서 추가하면 provider 처럼 "vpcAWSLambdaVPCAccessExecutionRole" 이 추가되어서 lambda 에 적용 
    ##역할 생성할 때, 왜 자동으로 vpcAWSLambdaVPCAccessExecutionRole 가 추가 되는지 
#둘 다 provider 에서 정의한 역할이 아니라 새로 쓰여짐. 다만 provider 에서 추가한 role 이랑 iamRoleStatements 에서 추가한 role 이랑 자동으로 추가된 역할이 다름. 
#provider 에서 설정한 역할에 각 lambda 마다 역할 추가만 해주고 싶으면 ? (providerRole + Lambda1Role, providerRole + Labmda2Role 이런 형태) 